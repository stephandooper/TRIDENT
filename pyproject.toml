[project]
name = "trident"
version = "0.3.2"
description = "A package for preprocessing whole-slide images."
authors = [
    { name = "Guillaume Jaume", email = "guillaume.jaume@unil.ch" },
    { name = "Andrew Zhang", email = "andrewzh@mit.edu" },
    { name = "Paul Doucet", email = "homedoucetpaul@gmail.com" },
]
license = "CC-BY-NC-ND-4.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    "ipywidgets",
    "torch",
    "torchvision",
    "numpy",
    "pandas",
    "tqdm",
    "h5py",
    "matplotlib",
    "opencv-python",
    "scikit-image>=0.20",
    "openslide-python",
    "Pillow",
    "geopandas",
    "shapely",
    "requests",
    "huggingface-hub",
    "bioio",
    "bioio-ome-tiff",
    "bioio-tifffile",
    "pyvips",
    "transformers>=4.51,<5",
    "timm>=0.9.16,<2",
    "einops",
    "einops-exts",
    "scipy",
    "segmentation-models-pytorch",
    "safetensors",
]

[project.optional-dependencies]
openslide-binary = ["openslide-bin"]
patch-encoders = [
    "fairscale",
    "timm-ctp",
    "conch @ git+https://github.com/Mahmoodlab/CONCH.git",
    "musk @ git+https://github.com/lilab-stanford/MUSK",
]
slide-encoders = [
    "environs==11.0.0",
    "sacremoses==0.1.1",
    "gigapath @ git+https://github.com/prov-gigapath/prov-gigapath.git",
    "madeleine @ git+https://github.com/mahmoodlab/MADELEINE.git",
]
converter = ["pylibCZIrw"]
convert = ["pylibCZIrw"]
czi = ["pylibCZIrw"]
bioformats = ["bioio-bioformats"]
full = [
    "environs==11.0.0",
    "sacremoses==0.1.1",
    "fairscale",
    "timm-ctp",
    "conch @ git+https://github.com/Mahmoodlab/CONCH.git",
    "musk @ git+https://github.com/lilab-stanford/MUSK",
    "gigapath @ git+https://github.com/prov-gigapath/prov-gigapath.git",
    "madeleine @ git+https://github.com/mahmoodlab/MADELEINE.git",
    "pylibCZIrw",
]
omezarr = ["ngff-zarr>=0.12", "dask>=2024.10", "cf-units>=3.1", "zarr>=3.0.0a0"]

[project.scripts]
trident = "trident.cli:main"
run_batch_of_slides = "run_batch_of_slides:main"
run_single_slide = "run_single_slide:main"
trident-doctor = "trident.cli_doctor:main"

[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["run_batch_of_slides", "run_single_slide"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["trident*"]

[tool.setuptools.package-data]
trident = ["**/*.json"]
